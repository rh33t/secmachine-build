---
- name: install python and pip
  apt:
    name:
      - python3-pip
    state: present
  become: true

- name: install pyenv dependencies
  apt:
    name:
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - libncurses5-dev
      - libncursesw5-dev
      - libffi-dev
      - liblzma-dev
      - tk-dev
      - libgdbm-dev
      - libnss3-dev
      - uuid-dev
    state: present
  become: true
  when: install_pyenv | default(false) | bool

- name: install pyenv
  shell: curl -fsSL https://pyenv.run | bash
  args:
    creates: "~/.pyenv"
  when: install_pyenv | default(false) | bool

# apt ships these as importable modules as well as CLIs, which a pipx venv cannot do
- name: install python security tools
  apt:
    name:
      - python3-impacket
      - python3-pwntools
    state: present
  become: true
