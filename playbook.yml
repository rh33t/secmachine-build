---
- name: setup hacking environment
  hosts: localhost
  connection: local

  vars:
    desktop_sessions: [i3, xfce, mate]
    desktop_binaries:
      xfce4-session: xfce
      mate-session: mate

  # detection runs on every invocation, including tag-filtered ones, because
  # distro_id and desktop_environment gate tasks in several roles
  pre_tasks:
  - name: detect distribution
    set_fact:
      distro_id: >-
        {{ 'parrot' if 'Parrot' in ansible_facts['distribution']
           else 'kali' if 'Kali' in ansible_facts['distribution']
           else ansible_facts['distribution'] | lower }}
    tags: always

  - name: check the distribution is supported
    assert:
      that: distro_id in ['kali', 'parrot']
      fail_msg: >-
        {{ ansible_facts['distribution'] }} is not supported; this build targets
        Kali and Parrot. Add vars/{{ distro_id }}.yml to extend it.
    tags: always

  - name: load distribution variables
    include_vars: "vars/{{ distro_id }}.yml"
    tags: always

  - name: look for desktop session binaries
    stat:
      path: "/usr/bin/{{ item }}"
    register: session_binaries
    loop: "{{ desktop_binaries.keys() | list }}"
    tags: always

  - name: detect the desktop environment from the running session
    set_fact:
      # XDG_CURRENT_DESKTOP is uppercase on parrot ("MATE") and may carry a
      # prefix elsewhere ("ubuntu:GNOME"), so match case-folded substrings
      desktop_environment: "{{ desktop_sessions | select('in', xdg_desktop) | first | default('') }}"
    vars:
      xdg_desktop: "{{ ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') | lower }}"
    when: not desktop_environment
    tags: always

  - name: fall back to an installed session binary
    set_fact:
      # a Kali box ships xfce4-session even when the user is logged into MATE
      desktop_environment: >-
        {{ session_binaries.results | selectattr('stat.exists') | map(attribute='item')
           | map('extract', desktop_binaries) | first | default('unknown') }}
    when: not desktop_environment
    tags: always

  - name: report detection results
    debug:
      msg:
      - "distribution: {{ ansible_facts['distribution'] }} -> distro_id={{ distro_id }}"
      - "desktop: {{ desktop_environment }}"
      - "alacritty theme: {{ alacritty_theme }}, docker suite: {{ docker_distribution }}"
    tags: always

  roles:
  - system
  - tools
  - firefox-burpsuite
  - terminal
  - fonts
  - desktop
  - applications
  - dotfiles
