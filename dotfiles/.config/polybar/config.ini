[colors]
background = #23252e
foreground = #e6e6e6
dim = #767b85
accent = #367bf0
ok = #5ebdab
urgent = #d41919

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 32px
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2px
padding = 1
module-margin = 2
font-0 = JetBrainsMono Nerd Font:size=11;2
modules-left = i3
modules-right = cpu memory vpn pulseaudio date tray
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = false
format = <label-state><label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.urgent}
label-focused = %index%
label-focused-foreground = ${colors.foreground}
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-visible = %index%
label-visible-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1
label-urgent = %index%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 1

[module/tray]
type = internal/tray
tray-spacing = 4px

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.dim}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 5
format-prefix = "RAM "
format-prefix-foreground = ${colors.dim}
label = %percentage_used:2%%

# empty output hides the module, so no prefix here
[module/vpn]
type = custom/script
exec = $HOME/.bin/vpn-status.sh
interval = 5
label = %output%
label-foreground = ${colors.ok}
# the command substitution drops the newline the script echoes, which would otherwise paste as one
click-left = printf %s "$($HOME/.bin/vpn-status.sh)" | xsel -i --clipboard

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-muted = VOL muted
label-muted-foreground = ${colors.dim}

[module/date]
type = internal/date
interval = 30
date = %H:%M
date-alt = %a %d %b %H:%M
label = %date%
label-foreground = ${colors.accent}

[settings]
screenchange-reload = true
